[build]
  command = "npm run build:netlify"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# The adapter is auto-installed by Netlify; do not add SPA redirects or export static HTML.
# Execution is a no-op until BILLING_CRON_PROVIDER=netlify is set in Production.
[functions."billing-reconcile"]
  schedule = "0 6 * * *"
